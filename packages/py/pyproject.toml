[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "paystage"
version = "0.1.0"
description = "Thin Python transport to the hosted PayStage MCP endpoint. The evaluator is TypeScript; this package holds no policy logic and no keys."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
  "paystage",
  "x402",
  "mcp",
  "payment-safety",
  "agent-payments",
  "usdc",
  "base",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://api.paystage.xyz/mcp"
PayStage = "https://api.paystage.xyz/mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/paystage"]

[tool.hatch.build.targets.sdist]
include = [
  "src/paystage",
  "tests",
  "README.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: calls the hosted endpoint at https://api.paystage.xyz/mcp",
]
