name = "paystage-hosted"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"] # required: @x402 uses node:url; policy may touch node:fs
workers_dev = true

# Top-level worker = MAINNET-ready (Base mainnet, eip155:8453).
# Facilitator is Coinbase CDP (https://api.cdp.coinbase.com/platform/v2/x402),
# configured at runtime from CDP_API_KEY_ID / CDP_API_KEY_SECRET secrets.
# Do NOT set FACILITATOR_URL for mainnet — the CDP facilitator is used instead.
#
# Required secrets (set via `wrangler secret put <NAME>`):
#   PAYSTAGE_PAYTO             (treasury payTo address)
#   CDP_API_KEY_ID             (mainnet only)
#   CDP_API_KEY_SECRET         (mainnet only)
#   SUPABASE_URL               (telemetry: Supabase project URL, e.g. https://<ref>.supabase.co)
#   SUPABASE_SERVICE_ROLE_KEY  (telemetry: service role key — server-side only, never expose)
# Mainnet live: set CDP_API_KEY_ID / CDP_API_KEY_SECRET + PAYSTAGE_PAYTO via wrangler secret put.
# Telemetry: set SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY via wrangler secret put.


# Daily Supabase free-tier keep-alive (trivial SELECT via scheduled handler).
[triggers]
crons = ["0 12 * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
PAYSTAGE_PRICE = "$0.002"
PAYSTAGE_NETWORK = "eip155:8453"

[[routes]]
pattern = "api.paystage.xyz"
custom_domain = true

# ---------------------------------------------------------------------------
# Sepolia (Base testnet, eip155:84532) — uses the x402.org facilitator.
# ---------------------------------------------------------------------------
[env.sepolia]
name = "paystage-hosted-sepolia"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Only PAYSTAGE_PAYTO secret is needed for Sepolia.
# Set via: wrangler secret put PAYSTAGE_PAYTO --env sepolia
#
# Optional telemetry secrets for Sepolia (recommended: use a separate
# Supabase project or the same project with source='test'/'synthetic'):
#   SUPABASE_URL               (set via: wrangler secret put SUPABASE_URL --env sepolia)
#   SUPABASE_SERVICE_ROLE_KEY  (set via: wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env sepolia)


[env.sepolia.triggers]
crons = ["0 12 * * *"]

[env.sepolia.observability]
enabled = true
head_sampling_rate = 1

[env.sepolia.vars]
PAYSTAGE_PRICE = "$0.002"
PAYSTAGE_NETWORK = "eip155:84532"
FACILITATOR_URL = "https://x402.org/facilitator"

[[env.sepolia.routes]]
pattern = "sepolia.api.paystage.xyz"
custom_domain = true
