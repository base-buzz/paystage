# Deploy method copied from apps/console/wrangler.toml: OpenNext build output served
# by a Worker with a static-assets binding. Nothing here has been deployed yet; the
# parent session owns the first deploy.
name = "vouchguard"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Custom domains, now that the apex is free: the registrar import had left two proxied A records pointing at a
# parking origin, and Workers refused to attach the hostname while they existed. Deleted 2026-11-26; Workers now
# manages the DNS for both names itself.
[[routes]]
pattern = "vouchguard.app"
custom_domain = true

[[routes]]
pattern = "www.vouchguard.app"
custom_domain = true
