# Deploy method copied from apps/console/wrangler.toml: OpenNext build output served
# by a Worker with a static-assets binding. Nothing here has been deployed yet; the
# parent session owns the first deploy.
name = "vouchguard"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Routes, not custom domains: a custom domain requires the hostname to be free, and the zone already carries proxied
# A/AAAA records at the apex from the registrar import. A route binds to the zone and takes precedence over the origin
# those records point at, which is the same result without a DNS edit we do not hold a token for.
[[routes]]
pattern = "vouchguard.app/*"
zone_name = "vouchguard.app"
