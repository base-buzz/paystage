# Release workflow for all published @paystage/* packages.
#
# Publishes with npm provenance (signed SLSA attestation linking each tarball to
# this repo + commit) using npm Trusted Publishing (OIDC). No long-lived NPM_TOKEN.
#
# One-time setup on npmjs.com (needs the `paystage` npm login + 2FA), for EACH package:
#   @paystage/policy, @paystage/preflight, @paystage/auth-watch,
#   @paystage/velocity, @paystage/trade-preflight, @paystage/mcp
#   Settings -> Trusted Publisher -> GitHub Actions
#     Organization/user: base-buzz   Repository: paystage
#     Workflow filename: release.yml  Environment: (blank)
#
# Each publish step skips versions already on npm, so re-running a tag (or a tag
# pushed after a local publish) is a safe no-op.

name: release

on:
  push:
    tags:
      - "v*"
  # Daily canary. Same workflow file on purpose: npm Trusted Publishing is bound to a
  # workflow *filename*, so a separate canary.yml would be rejected with a 404 that looks
  # exactly like "publisher not configured".
  schedule:
    - cron: "0 20 * * *" # 09:00 NZDT
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Publishing is not parallel-safe: two tag pushes a minute apart had both workflows attempt the same version,
# and npm answered 409 "cannot publish over previously staged version". Serialising tag runs makes the second
# a no-op instead of a failure.
concurrency:
  group: release-${{ github.ref_type == 'tag' && 'stable' || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # `contents: write` is for the GitHub Release at the end of the stable branch, nothing else: the job already writes packages to npm and
    # a release cannot be created with a read token. `id-token: write` stays for the npm Trusted Publisher.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure npm >= 11.5.1
        run: |
          corepack enable
          npm install -g npm@latest
          npm --version
          node --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # x402-guard joined on 2026-11-12, after its Trusted Publisher entry existed. Its
      # 0.1.0 was published by hand and therefore carries no provenance; every version from
      # here does. Do not add a package to this list before its publisher entry exists — the
      # 404 takes the whole job down under `set -euo pipefail`.
      #
      # Tag push -> stable release on `latest`.
      # Schedule -> canary build on the `canary` tag, versioned by run number, so the
      # daily cadence never touches what anyone installs by default. This is the model
      # Next.js/TypeScript/Angular use: bleeding edge daily, stable on demand.
      - name: Publish packages (dependency order, skip existing, with provenance)
        run: |
          set -euo pipefail
          # `eliza-plugin` and `n8n` are deliberately absent: their names are not claimed on npm and have no Trusted
          # Publisher configured, so publishing them fails with E404 and takes the whole release down with it — which is what
          # happened on the 2026-11-21 21:30Z tag, where preflight 0.5.4 never got published because the job died on
          # @paystage/eliza-plugin@0.1.0. Add them back only after their pending publishers exist on npm.
          # `mandate` is deliberately absent until it exists on npm. A brand-new scoped package cannot be published by
          # a Trusted Publisher, because there is nothing for npm to attach the publisher to yet: the first publish has
          # to be a manual bootstrap, then the publisher entry, then this list. On 2026-11-26 the 02:31Z release died on
          # `@paystage/mandate@0.1.0-canary.94` with E404, taking every later package with it — mandate sits first in
          # dependency order, so "it is a new name" is not a small failure. See the operator card / backlog row.
          PKGS="policy receipt-verify preflight x402-guard x-evm auth-watch velocity trade-preflight skill mcp ai-sdk channel"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "stable release from tag ${GITHUB_REF_NAME}"
            for pkg in $PKGS; do
              VERSION=$(node -p "require('./packages/$pkg/package.json').version")
              if npm view "@paystage/$pkg@$VERSION" version >/dev/null 2>&1; then
                echo "@paystage/$pkg@$VERSION already on npm; skipping."
                continue
              fi
              # 409 on a concurrent/retried publish means the version exists — but only believe that if npm
              # now reports exactly the version we tried. Anything else is a real failure and must stay red.
              if ! npm publish -w "@paystage/$pkg" --access public --provenance 2>/tmp/pub.err; then
                # 403 is what npm returns for "you cannot publish over the previously published versions" — the 409 path was the only one recognised, so a second tag for a version that
                # already shipped turned the run red even though the registry was correct (2026-11-20, two tags 3 minutes apart).
                if grep -qE "409|EPUBLISHCONFLICT|cannot publish over|E403.*previously published" /tmp/pub.err; then
                  sleep 5
                  if [ "$(npm view "@paystage/$pkg@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
                    echo "@paystage/$pkg@$VERSION landed despite the conflict — treating as published."
                    continue
                  fi
                fi
                cat /tmp/pub.err
                exit 1
              fi
            done

            # A GitHub Release, because the tag alone is invisible to everything that mirrors releases rather than tags — Glama among them,
            # which is why our MCP server was missing from its listing while the tag existed. The notes come from `releases/<tag>.md` in the
            # repository so the body is reviewable in the PR that cuts the tag, `--verify-tag` stops it inventing a tag, and a `-canary` or
            # `-rN` tag is marked prerelease so "Latest" stays on a stable build.
            NOTES="releases/${GITHUB_REF_NAME}.md"
            if [ ! -f "$NOTES" ]; then
              # Not fatal: a release with generated notes beats no release. The guard reports the missing file so it gets written.
              printf '## %s\n\nPackages published from this tag.\n' "${GITHUB_REF_NAME}" > /tmp/notes.md
              NOTES=/tmp/notes.md
              echo "no releases/${GITHUB_REF_NAME}.md in the repo — creating the Release with placeholder notes"
            fi
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "a Release for $GITHUB_REF_NAME already exists — leaving it alone"
            else
              CASE_FLAGS=""
              case "$GITHUB_REF_NAME" in
                *-canary*|*-r[0-9]*) CASE_FLAGS="--prerelease" ;;
              esac
              gh release create "$GITHUB_REF_NAME" --title "PayStage ${GITHUB_REF_NAME}" --notes-file "$NOTES" --verify-tag $CASE_FLAGS
            fi
            exit 0
          fi

          echo "canary build from ${GITHUB_REF_NAME} run ${GITHUB_RUN_NUMBER}"
          SUFFIX="canary.${GITHUB_RUN_NUMBER}"

          # Stamp every package with the same canary version and point the umbrella at
          # its siblings, so a canary of @paystage/mcp actually contains canaries rather
          # than resolving back to the last stable versions.
          node -e '
            const fs = require("fs");
            const suffix = process.argv[1];
            const pkgs = process.argv.slice(2);
            const versions = {};
            for (const p of pkgs) {
              const f = `packages/${p}/package.json`;
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              versions[`@paystage/${p}`] = `${j.version}-${suffix}`;
              j.version = `${j.version}-${suffix}`;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            for (const p of pkgs) {
              const f = `packages/${p}/package.json`;
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              for (const dep of Object.keys(j.dependencies || {})) {
                if (versions[dep]) j.dependencies[dep] = versions[dep];
              }
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            console.log("stamped:", JSON.stringify(versions, null, 1));
          ' "$SUFFIX" $PKGS

          npm run build

          for pkg in $PKGS; do
            VERSION=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "@paystage/$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "@paystage/$pkg@$VERSION already on npm; skipping."
            else
              npm publish -w "@paystage/$pkg" --access public --provenance --tag canary
            fi
          done

  # After npm, publish the manifests to the official MCP registry — the place MCP
  # clients actually resolve against. It was two releases behind because nothing did
  # this automatically. Auth is GitHub OIDC: no token to rotate, nothing that can
  # publish outside CI.
      # The artifact people install has to be the artifact in the repo. mcp.so showed five tools and
      # was right: @paystage/mcp@0.3.5 on npm registered five while the repo registered nine, and no
      # check had ever opened the tarball. This opens it.
      - name: Assert the published artifacts match the repo
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          # `eliza-plugin` and `n8n` are deliberately absent: their names are not claimed on npm and have no Trusted
          # Publisher configured, so publishing them fails with E404 and takes the whole release down with it — which is what
          # happened on the 2026-11-21 21:30Z tag, where preflight 0.5.4 never got published because the job died on
          # @paystage/eliza-plugin@0.1.0. Add them back only after their pending publishers exist on npm.
          PKGS="policy receipt-verify preflight x402-guard x-evm auth-watch velocity trade-preflight skill mcp ai-sdk channel"
          for pkg in $PKGS; do
            echo "--- @paystage/$pkg"
            node scripts/assert-artifact.mjs "@paystage/$pkg" --latest --wait 420
          done

      # assert-artifact compares the tarball to this commit; this installs the thing and
      # imports it. A version can be correct and still not load — and the one package a
      # user types is the one worth proving (#317).
      - name: Install and import the published umbrella
        if: github.ref_type == 'tag'
        run: node scripts/check-tarballs.mjs --install

  # The canary date badge's value has to come from the run that published the canary, not from a string in the README. Shields reads it as an
  # endpoint badge from badges/canary.json, so something has to write that file where shields can reach it. Branch protection refuses a
  # github-actions[bot] push to main, so the JSON lives on the dedicated, unprotected `badges` branch, and only this scheduled path writes it —
  # after `publish` succeeded, never on a failed run, never on a tag run (a stable tag is not a canary).
  badge-canary:
    needs: publish
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main (for the badge writer)
        uses: actions/checkout@v4
        with:
          path: app
      - name: Checkout the badges branch (unprotected, so the bot may push)
        uses: actions/checkout@v4
        with:
          ref: badges
          path: badges
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Write the date of this scheduled publish
        run: node app/scripts/write-canary-badge.mjs canary.json
      - name: Push the badge JSON to the badges branch
        working-directory: badges
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canary.json
          if git diff --cached --quiet; then
            echo "canary date unchanged since the last scheduled run; nothing to push"
            exit 0
          fi
          git commit -m "badge: canary last published $(date -u +%F)"
          git push origin HEAD:badges

  registry:
    needs: publish
    # Only a stable tag publishes to the MCP registry; canary builds must not move what
    # clients resolve to.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The publisher is a Go binary from the registry's GitHub releases. There is an
      # npm package called `mcp-publisher` too, but it is an MCP server — installing it
      # makes this job "succeed" while publishing nothing, which is exactly what
      # happened on the first attempt.
      - name: Install the publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version || ./mcp-publisher --help | head -5
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish every server.json
        working-directory: packages
        run: |
          set -e
          # Packages with no npm Trusted Publisher entry cannot be published, and the
          # registry validates mcpName against the published tarball. Skip them loudly:
          # a silent skip would look like success.
          NO_TRUSTED_PUBLISHER="auth-watch trade-preflight"
          for manifest in */server.json; do
            pkg=$(dirname "$manifest")
            if printf '%s' " $NO_TRUSTED_PUBLISHER " | grep -q " $pkg "; then
              echo "skipping $pkg — no npm Trusted Publisher for @paystage/$pkg yet."
              echo "  fix: add the Trusted Publisher, delete it from NO_TRUSTED_PUBLISHER, republish."
              continue
            fi
            echo "publishing $manifest"
            out=$( (cd "$pkg" && "$GITHUB_WORKSPACE/mcp-publisher" publish) 2>&1 ) && { printf '%s\n' "$out"; continue; }
            printf '%s\n' "$out"
            # The registry validates each version once. A release tag republishes every
            # manifest, so an unchanged sibling is expected to collide — that is not a
            # failure, and treating it as one aborts the loop before the package that
            # actually changed. Anything else is a real failure.
            if printf '%s' "$out" | grep -q "cannot publish duplicate version"; then
              echo "  already registered at this version; skipping"
              continue
            fi
            echo "  registry publish failed for $pkg"
            exit 1
          done
