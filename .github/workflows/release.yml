# Release workflow for all published @paystage/* packages.
#
# Publishes with npm provenance (signed SLSA attestation linking each tarball to
# this repo + commit) using npm Trusted Publishing (OIDC). No long-lived NPM_TOKEN.
#
# One-time setup on npmjs.com (needs the `paystage` npm login + 2FA), for EACH package:
#   @paystage/policy, @paystage/preflight, @paystage/auth-watch,
#   @paystage/velocity, @paystage/trade-preflight, @paystage/mcp
#   Settings -> Trusted Publisher -> GitHub Actions
#     Organization/user: base-buzz   Repository: paystage
#     Workflow filename: release.yml  Environment: (blank)
#
# Each publish step skips versions already on npm, so re-running a tag (or a tag
# pushed after a local publish) is a safe no-op.

name: release

on:
  push:
    tags:
      - "v*"
  # Daily canary. Same workflow file on purpose: npm Trusted Publishing is bound to a
  # workflow *filename*, so a separate canary.yml would be rejected with a 404 that looks
  # exactly like "publisher not configured".
  schedule:
    - cron: "0 20 * * *" # 09:00 NZDT
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure npm >= 11.5.1
        run: |
          corepack enable
          npm install -g npm@latest
          npm --version
          node --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Tag push -> stable release on `latest`.
      # Schedule -> canary build on the `canary` tag, versioned by run number, so the
      # daily cadence never touches what anyone installs by default. This is the model
      # Next.js/TypeScript/Angular use: bleeding edge daily, stable on demand.
      - name: Publish packages (dependency order, skip existing, with provenance)
        run: |
          set -euo pipefail
          PKGS="policy preflight auth-watch velocity trade-preflight x402-guard mcp"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "stable release from tag ${GITHUB_REF_NAME}"
            for pkg in $PKGS; do
              VERSION=$(node -p "require('./packages/$pkg/package.json').version")
              if npm view "@paystage/$pkg@$VERSION" version >/dev/null 2>&1; then
                echo "@paystage/$pkg@$VERSION already on npm; skipping."
              else
                npm publish -w "@paystage/$pkg" --access public --provenance
              fi
            done
            exit 0
          fi

          echo "canary build from ${GITHUB_REF_NAME} run ${GITHUB_RUN_NUMBER}"
          SUFFIX="canary.${GITHUB_RUN_NUMBER}"

          # Stamp every package with the same canary version and point the umbrella at
          # its siblings, so a canary of @paystage/mcp actually contains canaries rather
          # than resolving back to the last stable versions.
          node -e '
            const fs = require("fs");
            const suffix = process.argv[1];
            const pkgs = process.argv.slice(2);
            const versions = {};
            for (const p of pkgs) {
              const f = `packages/${p}/package.json`;
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              versions[`@paystage/${p}`] = `${j.version}-${suffix}`;
              j.version = `${j.version}-${suffix}`;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            for (const p of pkgs) {
              const f = `packages/${p}/package.json`;
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              for (const dep of Object.keys(j.dependencies || {})) {
                if (versions[dep]) j.dependencies[dep] = versions[dep];
              }
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            console.log("stamped:", JSON.stringify(versions, null, 1));
          ' "$SUFFIX" $PKGS

          npm run build

          for pkg in $PKGS; do
            VERSION=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "@paystage/$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "@paystage/$pkg@$VERSION already on npm; skipping."
            else
              npm publish -w "@paystage/$pkg" --access public --provenance --tag canary
            fi
          done

  # After npm, publish the manifests to the official MCP registry — the place MCP
  # clients actually resolve against. It was two releases behind because nothing did
  # this automatically. Auth is GitHub OIDC: no token to rotate, nothing that can
  # publish outside CI.
  registry:
    needs: publish
    # Only a stable tag publishes to the MCP registry; canary builds must not move what
    # clients resolve to.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The publisher is a Go binary from the registry's GitHub releases. There is an
      # npm package called `mcp-publisher` too, but it is an MCP server — installing it
      # makes this job "succeed" while publishing nothing, which is exactly what
      # happened on the first attempt.
      - name: Install the publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version || ./mcp-publisher --help | head -5
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish every server.json
        working-directory: packages
        run: |
          set -e
          for manifest in */server.json; do
            echo "publishing $manifest"
            (cd "$(dirname "$manifest")" && "$GITHUB_WORKSPACE/mcp-publisher" publish)
          done
