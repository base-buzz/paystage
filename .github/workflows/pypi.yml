# Build and publish the `paystage` package on PyPI.
#
# PyPI authentication is OIDC trusted publishing: this workflow has
# `id-token: write` and the publish step has no password, no API token and no
# repository secret. Configure the publisher on PyPI once for:
#
#   project:   paystage
#   owner:     base-buzz
#   repository: paystage
#   workflow:  pypi.yml
#   environment: (blank)
#
# A tag matching `v*-py-*` publishes the version in py/pyproject.toml.
# `workflow_dispatch` runs the same path, so a manual run can publish too; bump
# the version first, because PyPI rejects a version that already exists.
#
# The live contract test (`pytest -m live`) is deliberately not part of this
# workflow: it calls the hosted endpoint and needs a built TypeScript evaluator.
# Run it on demand with `pytest -m live` from py.

name: pypi

on:
  push:
    tags:
      - "v*-py-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is deliberately absent: it reached end-of-life in October 2025 and the current runner image no longer ships it, so a
        # ">=3.9" claim would be a floor nothing tests. The package requires >=3.10 and the matrix starts there.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and pytest
        working-directory: py
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      - name: Import smoke test
        run: |
          python - <<'PY'
          import paystage
          assert paystage.DEFAULT_ENDPOINT == "https://api.paystage.xyz/mcp"
          assert paystage.__version__ == "0.1.0"
          print("paystage", paystage.__version__, paystage.DEFAULT_ENDPOINT)
          PY

      - name: Contract and transport tests (no network)
        working-directory: py
        run: python -m pytest -m "not live"

  build:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build
        working-directory: py
        run: python -m build

      - name: Check the built metadata
        working-directory: py
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: py/dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI (OIDC)
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password`: the action exchanges the GitHub OIDC token for a
        # short-lived PyPI upload token.
