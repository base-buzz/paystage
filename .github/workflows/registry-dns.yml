# RETIRED — this workflow no longer publishes anything.
#
# The `xyz.paystage/*` namespace on registry.modelcontextprotocol.io was claimed by a
# DNS TXT proof at the domain apex. The private key behind that record is not in this
# repo, and `MCP_REGISTRY_KEY` does not exist as a repository secret, so the old
# workflow could never run: it failed at `login dns` before publishing a single entry.
#
# The canonical namespace is now `io.github.base-buzz/*`, published from `release.yml`
# with GitHub OIDC (`./mcp-publisher login github-oidc`) on a stable tag. That path needs
# no token and no DNS key.
#
# What is left of the DNS namespace on the registry is frozen published state. It is not
# ours to delete: the entries were published by the previous owner of the proof key, and
# nothing in this repo can update or remove them. Documents no longer cite it as current.
#
# Kept as a workflow file, rather than deleted, so a bookmark or a link to it lands on an
# explanation instead of a 404. It is inert: manual trigger only, read-only token, no
# secrets, no DNS write, no registry publish.

name: registry-dns (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Say what happened to this workflow
        run: |
          cat <<'EOF'
          registry-dns is retired.

          The xyz.paystage/* registry namespace was claimed by a DNS TXT proof whose
          private key is not in this repo, and the DNS proof key has no repository
          secret. This workflow could never authenticate, so it never published.

          The canonical namespace is io.github.base-buzz/*, published by release.yml
          with GitHub OIDC on a stable tag. Documents cite that name only.
          EOF
