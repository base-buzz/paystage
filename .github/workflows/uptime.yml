# Uptime probe — what a caller experiences, every 10 minutes, from GitHub's network.
#
# The conformance kit answers "do our published claims still hold?", once a day. This
# answers "can an agent reach the gate right now?", which is the question that matters
# during an incident and the one our own CI cannot answer: it runs on the same account
# and the same assumptions as the thing it checks.
#
# On failure it opens (or updates) a single deduplicated issue; on recovery it closes
# it. Read + issues write only — it never deploys or changes anything.

name: uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Probe production
        id: probe
        run: |
          set +e
          node scripts/uptime-probe.mjs > probe.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          node -e '
            const d = require("./probe.json");
            const lines = d.results.map((r) =>
              `| ${r.ok ? "ok" : "**FAIL**"} | ${r.name} | ${r.status ?? "-"} | ${r.ms} ms | ${r.server_timing ?? ""} |`);
            console.log("## Uptime probe\n");
            console.log("checked at " + d.checked_at + "\n");
            console.log("| | check | status | time | server-timing |");
            console.log("|---|---|---|---|---|");
            console.log(lines.join("\n"));
            require("fs").writeFileSync("body.md", ["## Uptime probe", "", "checked at " + d.checked_at, "", "| | check | status | time | server-timing |", "|---|---|---|---|---|", ...lines].join("\n"));
            console.log("\nfailed: " + (d.failed.length ? d.failed.join("; ") : "none"));
          '
        continue-on-error: true

      # The protocol assertions the HTTP probe cannot make (#325).
      #
      # uptime-probe checks reachability; it cannot tell a working endpoint from one that answers 200 with an empty tool list. `mcp-canary` speaks the real protocol over Streamable
      # HTTP — initialize, tools/list, and calling a tool — and asserts the verdicts. A broken `tools/list` now turns this red inside ten minutes instead of being found by a user.
      - name: Assert the MCP protocol
        id: mcp
        run: |
          set +e
          node scripts/mcp-canary.mjs > mcp-canary.log 2>&1
          rc=$?
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          cat mcp-canary.log
          exit $rc
        continue-on-error: true

      # Append one probe result to the SLO history (#58). Committed back to the repo so the error budget is computed
      # from a record anyone can audit, not from a dashboard nobody can query later.
      - name: Record the probe for the SLO budget
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const path = "docs/state/uptime.json";
            const d = JSON.parse(fs.readFileSync("probe.json", "utf8"));
            const history = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, "utf8")) : [];
            history.push({ at: d.checked_at, ok: d.failed.length === 0, checks: d.results.length, failed: d.failed });
            // Keep 90 days: the SLO window is 30 and headroom costs nothing but a longer file.
            const cutoff = Date.now() - 90 * 86400000;
            fs.writeFileSync(path, JSON.stringify(history.filter((h) => new Date(h.at).getTime() >= cutoff), null, 1));
          '
          node scripts/check-slo.mjs
      - name: Commit the history
        if: always()
        run: |
          git config user.name "the project team"
          git config user.email "ops@paystage"
          git add docs/state/uptime.json
          git diff --quiet --cached || git commit -m "ops: uptime probe recorded for the SLO budget [skip ci]"
          git push || echo "history commit skipped (branch protection)"
      - name: Show the table
        run: cat body.md >> "$GITHUB_STEP_SUMMARY"

      # A degraded challenge path (503) counts as a failure here on purpose: an agent
      # that cannot get a challenge cannot pay, which is an outage for its purpose even
      # though the Worker is up.
      - name: Open or update the incident issue
        if: steps.probe.outputs.exit != '0' || steps.mcp.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="uptime: production is not answering correctly"
          existing=$(gh issue list --label uptime --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --label uptime --body-file body.md
          fi

      - name: Close the incident issue on recovery
        if: steps.probe.outputs.exit == '0' && steps.mcp.outputs.exit == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --label uptime --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Recovered — probe green at $(date -u +%FT%TZ)."
            gh issue close "$existing"
          fi

      # The issue is the durable signal, but a green run would let the failure hide in
      # the Actions tab. Make the run red too.
      # Two different failures, one red run: the HTTP probe answers "can an agent reach us", the canary answers "does the protocol work when it does".
      - name: Fail the run when the probe or the canary failed
        if: steps.probe.outputs.exit != '0' || steps.mcp.outputs.exit != '0'
        run: |
          echo "probe exit: ${{ steps.probe.outputs.exit }}"
          echo "canary exit: ${{ steps.mcp.outputs.exit }}"
          exit 1
