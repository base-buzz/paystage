name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the dependency check diffs the PR against its base, and a shallow clone has no merge base —
          # which failed the first run with "no merge base" rather than with a finding.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test
      # Copy drift, with the network check on: a README is what a stranger evaluates us on,
      # and a dead listing link or a stale version is invisible to every other test.
      - run: node scripts/check-copy.mjs --network
      - run: node scripts/check-claims.mjs
      - run: node scripts/check-client-manifests.mjs
      - run: node scripts/check-published-links.mjs
      # Publish lists are hand-written in three places; a package missing from one is never released and
      # never asserted. Compare all three against packages/ so the failure lands on the commit that adds it.
      - run: node scripts/check-publish-list.mjs
      - run: node scripts/check-count-claims.mjs
      - run: node scripts/check-network-claims.mjs
      - run: node scripts/gen-integrations.mjs --check
      - run: node scripts/sync-tool-docs.mjs --check
      - run: node scripts/check-privacy.mjs
      - run: node scripts/check-contrast.mjs
      - run: node starter/check.mjs
      - run: node scripts/sync-glossary.mjs --check
      - run: node examples/run.mjs
      # Starts the published server over stdio and asserts five tools answer. The install
      # command in every README was wrong for three releases and nothing caught it.
      - run: node scripts/mcp-handshake.mjs
      - run: node scripts/check-bins.mjs
      - run: node scripts/check-registry-probe.mjs
      - run: node scripts/check-changelog.mjs
      - run: node scripts/check-route-styles.mjs
      - run: node scripts/check-provenance.mjs
      - run: node scripts/check-new-deps.mjs --base origin/main
      - run: node scripts/check-i18n-discovery.mjs
      - run: node scripts/check-client-id.mjs
      - run: node scripts/check-version-parity.mjs
      - run: node scripts/check-env-vars.mjs
      - run: node scripts/check-workflows.mjs
      - run: node scripts/check-script-bins.mjs
      - run: node scripts/check-route-docs.mjs
      - run: node scripts/check-openapi-contract.mjs
      - run: node scripts/check-agent-discovery.mjs
      - run: node scripts/check-security.mjs
      - run: node scripts/check-hosted-deps.mjs
      - run: node scripts/check-staged-secrets.mjs --all
      - run: node scripts/check-manifests.mjs
      - run: node scripts/check-manifest-packages.mjs
      - run: node scripts/check-dep-pins.mjs
      - run: node scripts/check-canary-badge.mjs
      - run: node scripts/check-client-env.mjs
      - run: node scripts/check-deps-budget.mjs
      - run: node scripts/check-pypi-package.mjs
