name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test
      # Copy drift, with the network check on: a README is what a stranger evaluates us on,
      # and a dead listing link or a stale version is invisible to every other test.
      - run: node scripts/check-copy.mjs --network
      # Starts the published server over stdio and asserts five tools answer. The install
      # command in every README was wrong for three releases and nothing caught it.
      - run: node scripts/mcp-handshake.mjs
      - run: node scripts/check-manifests.mjs
