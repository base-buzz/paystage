# Daily cadence checks — the evidence behind the "this project is alive" claim.
#
# Runs the conformance kit against production and the dependency audit against the
# workspace. Results are read back by the landing page from the Actions API, so the
# site shows the real run history rather than a badge we assert.
#
# Deliberately read-only: no `contents: write`, no deploys, no publishing. A check
# that can change what it checks is not a check.

name: cadence

on:
  schedule:
    - cron: "0 20 * * *" # 09:00 NZDT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The kit imports `@paystage/policy` from the workspace. Without an install it died with
      # ERR_MODULE_NOT_FOUND on 2 of the last 12 runs — the check was red because the checkout had no
      # node_modules, not because production was wrong. Two of the twelve "failures" were this, and a daily job that
      # cries wolf teaches everyone to ignore it.
      - name: Install
        # npm workspaces, matching `package-lock.json` — this repo does not use pnpm, and guessing a package manager
        # here would fail in a way that looks like a broken workflow rather than a broken assumption.
        run: npm ci
      - name: Build the workspace
        # Two reasons, both learned the hard way in one hour: `@paystage/policy` resolves to dist/ through its
        # package.json exports, and `@paystage/mcp` imports five sibling packages, so building a hand-picked subset
        # fails on the first one it left out. `npm run build` at the root builds them in dependency order — the same
        # thing a release does.
        run: npm run build
      - name: Run the conformance kit against production
        # tee, so the assertions are in the run log rather than only in the step summary. A red run nobody can read is a
        # red run that gets ignored — this one failed twice and its output was invisible.
        run: node apps/hosted/scripts/conformance.mjs 2>&1 | tee /tmp/conformance.log
        continue-on-error: true
        id: conformance
      - name: Print the summary
        # Reads the log the previous step wrote. This used to re-run the whole kit — a second pass of live network
        # calls whose failure was swallowed by `|| true`, so the summary could show a different answer from the job.
        run: |
          echo "### Conformance" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -40 /tmp/conformance.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no output captured)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Published artifacts match the repo
        # A hand publish, a failed tag step, or a registry lag can leave npm behind the repo. This is
        # the check that would have caught the five-tool package before mcp.so did.
        #
        # Every published package, not just the umbrella (#341). On 2026-11-20 `c6da068` changed both `packages/mcp` and `packages/preflight` without a version bump: the mcp half turned this job
        # red and the preflight half drifted in silence, because this step named one package. A loop over the same list `release.yml` publishes is the only version where a new package is
        # covered the day it is added.
        run: |
          set -euo pipefail
          PKGS="policy preflight x402-guard x-evm auth-watch velocity trade-preflight skill mcp ai-sdk"
          for pkg in $PKGS; do
            echo "--- @paystage/$pkg"
            node scripts/assert-artifact.mjs "@paystage/$pkg" --latest
          done
      - name: The canary itself is alive
        # Dead-man switch: the canary is what notices a broken payment path, and its own silence has to be noticed
        # by something. Fails when the newest line in the ops log is older than 36 hours.
        run: node scripts/check-canary-age.mjs || echo "  (no ops log in CI — informational outside the container)"
      - name: Every published version has a tarball
        # `velocity@0.2.2` had a complete version document on npm and a 404 tarball, so every
        # `npm install @paystage/mcp@0.8.8` failed while `npm view` reported the version happily. The
        # release assert caught it only for the packages that release published, and only when a release
        # happened; nothing watched the published set afterwards (#180). A version document is a claim,
        # the tarball is the artifact.
        run: node scripts/check-tarballs.mjs
      - name: Fail if the kit failed
        if: steps.conformance.outcome == 'failure'
        run: exit 1

  listings:
    name: listings
    permissions:
      contents: read
      issues: write
    # Listings are surfaces we cannot push: npm, the MCP registry, Glama, mcp.so. A stale listing is a report, not a
    # product failure — and mixing the two is how "the nightly is red" stopped meaning "the product is broken" (#183).
    # This job is never allowed to fail the run; it opens one issue and keeps the badge about the product.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Listing freshness
        id: listings
        continue-on-error: true
        run: |
          set +e
          node scripts/check-listings.mjs > /tmp/listings.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          tail -40 /tmp/listings.txt
          echo "### Listings" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -40 /tmp/listings.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update one issue when a listing is stale
        # One issue, updated in place: a daily job that opens a new issue every day trains people to close without
        # reading, which is the same failure as a red badge nobody trusts.
        if: steps.listings.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="listings: a surface is stale or unreadable"
          body=$(printf 'The daily listing check reported drift. This is **not** a product failure.\n\n```\n%s\n```\n' "$(tail -30 /tmp/listings.txt)")
          # The label may not exist yet; creating it here is cheaper than a failure that reads like a permissions bug.
          gh label create listings --color FBCA04 --description "a listing surface is stale or unreadable" 2>/dev/null || true
          existing=$(gh issue list --label listings --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label listings --body "$body"
          fi

  deps:
    name: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: npm audit (production tree)
        run: npm audit --omit=dev
