# Deploy vouchguard.app (the brand site) from CI.
#
# Why this exists: the brand site had **no CI deploy at all**. Every copy change to `/pricing`, `/brand` or the lander sat in `main`
# until somebody ran `npm run deploy:prod` on a machine with a logged-in wrangler — which is why the dated price shipped in the repo
# and stayed invisible on the site. Deploys belong to the same gate as everything else.
#
# What it deploys:
#   apps/vouchguard -> Worker `vouchguard` -> vouchguard.app
#
# The Worker name and domain are NOT literals here: `scripts/render-wrangler.mjs` writes the gitignored `wrangler.toml` from the
# repo-root `brand.json`, so a fork cannot commit one host's values.

name: deploy-vouchguard

on:
  push:
    branches: [main]
    paths:
      - "apps/vouchguard/**"
      - "packages/pass/**"
      - "brand.json"
      - "scripts/render-wrangler.mjs"
      - ".github/workflows/deploy-vouchguard.yml"
  workflow_dispatch:

concurrency:
  group: deploy-vouchguard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/vouchguard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/vouchguard/package-lock.json

      # The brand site consumes workspace packages through `file:` paths.
      - name: Install workspace dependencies
        working-directory: .
        run: npm ci

      - name: Build workspace packages
        working-directory: .
        run: npm run build

      - name: Install site dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # The route contract and the page copy are the guards for the counted question (#511). They run
      # here because this is the only workflow that ships vouchguard; a test step nowhere is a test step
      # that never gates the deploy.
      - name: Test
        run: npm test

      - name: Brand assets (geometry, contrast, tier sizes)
        working-directory: .
        run: node scripts/check-brand-assets.mjs

      - name: Pass assets (Apple's sizes, provenance comments)
        working-directory: .
        run: node scripts/check-pass-assets.mjs

      - name: Render the Worker config from brand.json
        run: node scripts/render-wrangler.mjs

      # The survey's three bindings, set from repository secrets so the Worker never needs a person at a keyboard. `wrangler secret put`
      # is idempotent: it overwrites, so a rotated key ships with the next deploy instead of drifting.
      - name: Survey bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SURVEY_SUPABASE_URL: ${{ secrets.SURVEY_SUPABASE_URL }}
          SURVEY_SUPABASE_ANON_KEY: ${{ secrets.SURVEY_SUPABASE_ANON_KEY }}
          SURVEY_IP_SALT: ${{ secrets.SURVEY_IP_SALT }}
        run: |
          set -euo pipefail
          if [ -z "${SURVEY_SUPABASE_URL:-}" ]; then
            echo "no survey secrets configured — /ask will honestly say the counter is not connected"
            exit 0
          fi
          # --config wrangler.toml, or wrangler reads the repo's wrangler.jsonc stub and addresses a worker name that does not exist
          printf '%s' "$SURVEY_SUPABASE_URL"       | npx wrangler secret put SURVEY_SUPABASE_URL --config wrangler.toml
          printf '%s' "$SURVEY_SUPABASE_ANON_KEY"  | npx wrangler secret put SURVEY_SUPABASE_ANON_KEY --config wrangler.toml
          printf '%s' "$SURVEY_IP_SALT"            | npx wrangler secret put SURVEY_IP_SALT --config wrangler.toml

      - name: Build the site
        run: npm run build

      - name: Build Worker bundle (OpenNext)
        run: npx opennextjs-cloudflare build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/vouchguard
          # `--config wrangler.toml` is required: the repo also carries a `wrangler.jsonc` stub (name + observability only), and
          # wrangler prefers it over the rendered TOML — which is how the first run of this workflow failed with "Missing
          # entry-point". The TOML is the one `render-wrangler.mjs` writes from brand.json.
          command: deploy --config wrangler.toml
          wranglerVersion: "4"

      - name: Smoke test the live domain
        run: |
          set -euo pipefail
          sleep 10
          for path in / /brand /pricing /ask /privacy /terms /llms.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://vouchguard.app${path}")
            [ "$code" = "200" ] || { echo "FAIL ${path} -> ${code}"; exit 1; }
            echo "ok   ${path}"
          done
          echo "deployed: $(curl -s https://vouchguard.app/llms.txt | head -1)"
