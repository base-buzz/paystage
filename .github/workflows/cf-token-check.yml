name: cf-token-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the Cloudflare token (prints status only)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "account secret length: ${#CF_ACCOUNT}"
          echo "token secret length: ${#CF_TOKEN}"
          echo "token prefix looks like: ${CF_TOKEN:0:3}..."
          code=$(curl -s -o /tmp/verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "verify http: $code"
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/verify.json'))
          print('success:', d.get('success'))
          r = d.get('result') or {}
          print('status:', r.get('status'))
          errs = d.get('errors') or []
          if errs:
              print('errors:', [(e.get('code'), e.get('message')) for e in errs])
          PY
