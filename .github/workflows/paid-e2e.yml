name: paid-e2e

# The money path, exercised by the thing that gates merges instead of by a container canary that dies
# with its host. Nightly and on tags, not per-PR: a third-party facilitator's flakiness should not
# block a merge, and forty seconds of network per push buys nothing.
on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC daily — off the hour so it does not queue behind every other cron
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Build workspace packages
        run: npm run build
      - name: Install hosted dependencies
        working-directory: apps/hosted
        # --legacy-peer-deps because wrangler 4.158 wants @cloudflare/workers-types ^5 while the app
        # pins ^4. That is a dev-only type package and the deploy workflow resolves it the same way
        # (newer npm is stricter about peer ranges than the lockfile was written for). Without this,
        # the paid job fails before it can test anything — a gate that is red for an unrelated reason
        # is a gate nobody looks at.
        run: npm ci --ignore-scripts --legacy-peer-deps
        # apps/hosted is not an npm workspace; it keeps its own lockfile.
      - name: Write the throwaway key
        env:
          E2E_KEY: ${{ secrets.PAYSTAGE_E2E_SEPOLIA_KEY }}
        run: |
          if [ -z "$E2E_KEY" ]; then
            echo "::error::PAYSTAGE_E2E_SEPOLIA_KEY is not set — the job cannot pay, and a green run would be empty"
            exit 1
          fi
          umask 077
          printf '%s\n' "$E2E_KEY" > "$RUNNER_TEMP/e2e.key"
          echo "PAYSTAGE_E2E_KEY_FILE=$RUNNER_TEMP/e2e.key" >> "$GITHUB_ENV"
      - name: Pay once on Base Sepolia
        working-directory: apps/hosted
        env:
          # #431: the paid e2e call proves it is CI's. Never echoed.
          PAYSTAGE_PROVENANCE_KEY: ${{ secrets.PAYSTAGE_PROVENANCE_KEY }}
        # The script exits non-zero with a distinct code per failure:
        #   3 = no PAYMENT-RESPONSE (the free tier answered; the job did not pay)
        #   4 = the test wallet cannot pay (balance below the floor)
        #
        # 4 is an infrastructure condition, not a product defect: the wallet ran dry and only a faucet fixes
        # it. A permanently red check for "we did not fund the testnet wallet" teaches everyone to ignore red.
        # So it is reported as a **warning with a summary line saying the money path was NOT tested** — which
        # is a different claim from "the money path works" — and the hourly canary files an escalation when
        # the balance is under the floor, so it is still someone's problem.
        run: |
          set +e
          npm run e2e:paid
          code=$?
          set -e
          if [ "$code" = "4" ]; then
            echo "::warning::paid-e2e did not run: the Sepolia test wallet is unfunded. The money path was NOT tested by this run."
            {
              echo "### paid-e2e: skipped, wallet unfunded"
              echo ""
              echo "The test wallet has no Base Sepolia USDC, so no payment was attempted. **This run did not test the money path.**"
              echo "Fund it from the Circle faucet; the hourly canary escalates until it is."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/e2e.key"
